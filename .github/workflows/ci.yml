# appkit 自身的 CI（域仓库请用 domain-ci.yml）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: arc-forgeplex-runner
    env:
      TEST_DATABASE_URL: postgres://postgres:appkit@127.0.0.1:55499/appkit_test?sslmode=disable
    steps:
      - name: Start disposable PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/usr/lib/postgresql/18/bin:$PATH" LD_LIBRARY_PATH=/opt/pg-deps
          touch /tmp/arc-start-postgres
          for ((attempt=0; attempt<60; attempt++)); do
            pg_isready -h 127.0.0.1 -p 55499 -U postgres && break
            sleep 1
          done
          socket=$(cat /tmp/arc-postgres-socket)
          [[ "$socket" =~ ^/tmp/webhook-db-test\.[A-Za-z0-9]{8}/socket$ ]]
          export PGHOST="$socket" PGPORT=55499 PGUSER=postgres
          [[ $(psql -XAtd postgres -c 'SHOW listen_addresses') == 127.0.0.1 ]]
          [[ $(psql -XAtd postgres -c 'SHOW data_directory') == /arc-data/db ]]
          mount=$(psql -XAtd postgres -c "SELECT pg_read_file('/proc/self/mounts')" | awk '$2 == "/arc-data" && $3 == "tmpfs" {print $4}')
          for flag in nosuid noexec size=524288k; do [[ ",$mount," == *",$flag,"* ]]; done
          createdb appkit_test
          psql -X -v ON_ERROR_STOP=1 -d appkit_test -c 'CREATE EXTENSION pg_stat_statements'
          echo "WEBHOOK_TEST_DATABASE_URL=postgresql:///appkit_test?host=$socket&port=55499&user=postgres&sslmode=disable" >> "$GITHUB_ENV"
          echo "WEBHOOK_TEST_DISPOSABLE=1" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # apidiff 门禁需要完整历史与 tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # 内部 acceptance/scaffold 测试会在子进程中关闭网络，构建完整的
      # appkit 工作区。显式预热整个 module graph，不能依赖 runner 缓存恰好
      # 已包含仅在生成域构建中才会加载的间接依赖。
      - name: 预热完整 Go module cache
        run: go mod download all

      # Makefile 是框架自检的唯一事实源；该入口要求一次性数据库并运行 race 测试。
      - name: 框架自检（make ci）
        run: make ci

      - name: go.mod 整洁检查
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      # appkit 经 MVS 依赖钻石被全部域仓库共享，公开 API 近乎终身兼容
      # （DESIGN §9）。主 module 与 lint/ 嵌套 module 分别对比最新发版 tag。
      - name: API 向后兼容门禁（apidiff vs 最新 tag）
        run: |
          # --match 排除 lint/vX.Y.Z 路标 tag（lint/ 嵌套 module 的 Go 模块
          # 解析需要，见 Makefile tag 目标），基线永远指主 module 的发版 tag。
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "无发版 tag，跳过 apidiff"
            exit 0
          fi
          git worktree add /tmp/apidiff-base "$base"
          # Revision pinned on 2026-09-04; dependency automation updates it by PR.
          apidiff=golang.org/x/exp/cmd/apidiff@e88cd73687aa969fbec16261e6c467ab22a053f2
          (cd /tmp/apidiff-base && go run "$apidiff" -m -w /tmp/base.export github.com/forgeplex/appkit)
          go run "$apidiff" -m -w /tmp/head.export github.com/forgeplex/appkit
          out=$(go run "$apidiff" -m -incompatible /tmp/base.export /tmp/head.export 2>/dev/null)
          if [ -n "$out" ]; then
            echo "相对 $base 存在破坏性 API 变更（appkit 必须向后兼容，见 docs/DESIGN.md §9）:"
            echo "$out"
            exit 1
          fi
          echo "相对 $base 无破坏性变更"

          # lint/ 是单独发布的 Go module；主 module 的 apidiff 不会加载它。
          # 两个 module 的版本 tag 锁步，因此从同一 base commit 比较。
          (cd /tmp/apidiff-base/lint && go run "$apidiff" -m -w /tmp/base.lint.export github.com/forgeplex/appkit/lint)
          (cd lint && go run "$apidiff" -m -w /tmp/head.lint.export github.com/forgeplex/appkit/lint)
          lint_out=$(go run "$apidiff" -m -incompatible /tmp/base.lint.export /tmp/head.lint.export 2>/dev/null)
          if [ -n "$lint_out" ]; then
            echo "相对 $base 存在破坏性 API 变更（lint module，见 docs/STABILITY.md）:"
            echo "$lint_out"
            exit 1
          fi
          echo "lint module 相对 $base 无破坏性变更"

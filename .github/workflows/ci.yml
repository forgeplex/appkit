# appkit 自身的 CI（域仓库请用 domain-ci.yml）。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
        env:
          POSTGRES_PASSWORD: appkit
          POSTGRES_DB: appkit_test
        ports:
          - 55499:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:appkit@127.0.0.1:55499/appkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # apidiff 门禁需要完整历史与 tag

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: gofmt 检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: go.mod 整洁检查
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: lint 子 module（appkit-lint analyzers）
        run: |
          cd lint
          go build ./...
          go test ./...

      # appkit 只生产规则集（ruleset/templates）、自己不消费——golden 测试锁的是
      # 「模板文本没变」，防不住「规则从写下来那天就是错的」。这一步生成一个
      # 每个组件都带子包的域仓库，用钉版本的检查器真跑，再植入已知违规确认会红。
      - name: 规则集端到端（真跑 golangci-lint + go-arch-lint）
        run: make test-rules

      # appkit 经 MVS 依赖钻石被全部域仓库共享，公开 API 近乎终身兼容
      # （DESIGN §9）。基线 = 最新发版 tag，破坏性变更直接红灯。
      - name: API 向后兼容门禁（apidiff vs 最新 tag）
        run: |
          # --match 排除 lint/vX.Y.Z 路标 tag（lint/ 嵌套 module 的 Go 模块
          # 解析需要，见 Makefile tag 目标），基线永远指主 module 的发版 tag。
          base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          if [ -z "$base" ]; then
            echo "无发版 tag，跳过 apidiff"
            exit 0
          fi
          git worktree add /tmp/apidiff-base "$base"
          # Revision pinned on 2026-09-04; dependency automation updates it by PR.
          apidiff=golang.org/x/exp/cmd/apidiff@e88cd73687aa969fbec16261e6c467ab22a053f2
          (cd /tmp/apidiff-base && go run "$apidiff" -m -w /tmp/base.export github.com/forgeplex/appkit)
          go run "$apidiff" -m -w /tmp/head.export github.com/forgeplex/appkit
          out=$(go run "$apidiff" -m -incompatible /tmp/base.export /tmp/head.export 2>/dev/null)
          if [ -n "$out" ]; then
            echo "相对 $base 存在破坏性 API 变更（appkit 必须向后兼容，见 docs/DESIGN.md §9）:"
            echo "$out"
            exit 1
          fi
          echo "相对 $base 无破坏性变更"

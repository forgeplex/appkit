# 域仓库复用的 CI（域仓库的 .github/workflows/ci.yml 由 appkit sync 生成，一行 uses 引用本文件）。
name: domain-ci

on:
  workflow_call:
    inputs:
      go-version:
        description: Go 版本
        type: string
        required: false
        default: "1.26"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:appkit@127.0.0.1:55499/appkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      # 仍保留 CI 中现有的 TCP DSN（checkout / transfer 的 fixture 守卫精确
      # 校验它），同时给 webhook 的破坏性集成测试提供独立随机 Unix socket。
      # PostgreSQL 只在本 job 的容器里；TCP 仅绑定 runner 回环地址，数据目录
      # 在容器可写层，socket 目录是本 job 新建的随机路径。
      - name: 启动隔离 PostgreSQL 测试库
        shell: bash
        run: |
          set -euo pipefail
          db_root=$(mktemp -d /tmp/webhook-db-test.XXXXXXXX)
          chmod 0755 "$db_root"
          db_socket="$db_root/socket"
          mkdir -m 0777 "$db_socket"
          db_container="appkit-domain-db-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'APPKIT_TEST_DB_ROOT=%s\n' "$db_root"
            printf 'APPKIT_TEST_DB_CONTAINER=%s\n' "$db_container"
            printf 'WEBHOOK_TEST_DATABASE_URL=postgresql:///appkit_test?host=%s&user=postgres&sslmode=disable\n' "$db_socket"
            printf 'WEBHOOK_TEST_DISPOSABLE=1\n'
          } >> "$GITHUB_ENV"

          docker run --detach --name "$db_container" \
            --publish 127.0.0.1:55499:5432 \
            --mount "type=bind,source=$db_root,target=$db_root" \
            --tmpfs /var/lib/postgresql:rw,noexec,nosuid,size=512m \
            --env POSTGRES_USER=postgres \
            --env POSTGRES_PASSWORD=appkit \
            --env POSTGRES_DB=appkit_test \
            postgres:18.6@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280 \
            -c "unix_socket_directories=/var/run/postgresql,$db_socket" \
            -c shared_preload_libraries=pg_stat_statements \
            -c pg_stat_statements.max=100000

          ready=0
          for ((attempt = 0; attempt < 60; attempt++)); do
            if docker exec "$db_container" pg_isready -h "$db_socket" -U postgres -d appkit_test >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != 1 ]]; then
            docker logs "$db_container"
            echo "::error::隔离 PostgreSQL 未在 60 秒内就绪"
            exit 1
          fi
          docker exec "$db_container" psql --no-psqlrc --set ON_ERROR_STOP=1 \
            --username postgres --dbname appkit_test \
            --command 'CREATE EXTENSION pg_stat_statements'

      - name: gofmt 检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化:"
            echo "$out"
            exit 1
          fi

      # 域仓库 go.mod 钉的 appkit 版本即工具版本（规则与依赖同版本升级，
      # 不搞 @main 惊喜）。CI 中取不到正式版本就是装配错误，直接失败；
      # 本地 go.work 联调不走这条 reusable workflow。
      # 所有 go run appkit 工具必须带 @版本：不带会用域仓库的 go.sum 编译
      # appkit cmd，而 go mod tidy 又把域仓库 import 图之外的 sums 剥掉
      # ——「appkit check 能跑」与「go.mod 整洁检查」两头必红一头，域侧无解。
      - name: 解析 appkit 工具版本
        run: |
          v=$(go list -m github.com/forgeplex/appkit 2>/dev/null | awk '{print $2}')
          case "$v" in
            v*) ;;
            *)
              echo "::error::go.mod 必须 require 正式 appkit 版本，CI 禁止回退 main（当前: $v）"
              exit 1
              ;;
          esac
          echo "APPKIT_TOOL=$v" >> "$GITHUB_ENV"

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: appkit check（架构检查）
        run: go run github.com/forgeplex/appkit/cmd/appkit@"$APPKIT_TOOL" check

      - name: appkit sync 漂移检查
        run: go run github.com/forgeplex/appkit/cmd/appkit@"$APPKIT_TOOL" sync --check

      # schema 文档漂移：改了迁移却没跑 make schema 就会红。
      # 不加 if: 守卫也不加 continue-on-error——跳不跳由命令自己按启用门决定：
      # db/SCHEMA.md 与 db/schema/ 都不存在的仓库打一条 ::notice 后退出 0，
      # 任一存在就严格检查。reusable workflow 随域仓库声明的 appkit
      # release commit 固定，新增检查只在显式升级并 sync 后生效。
      - name: appkit schema 漂移检查
        run: go run github.com/forgeplex/appkit/cmd/appkit@"$APPKIT_TOOL" schema -check

      # 先验规则集未漂移，再按规则集跑 lint——否则跑的可能是被改松的配置。
      # 版本必须与 ruleset.GolangciLintVersion / ruleset.ArchLintVersion 一致
      # （域仓库 Makefile 的 lint 目标从那里渲染），否则本地绿、CI 红。
      - name: golangci-lint（depguard / wrapcheck / forbidigo）
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

      - name: go-arch-lint（组件依赖矩阵）
        run: go run github.com/fe3dback/go-arch-lint@v1.18.0 check

      # 自研检查器：金额禁 float / decimal 不上 JSON 面 / ctx 不进 struct。
      # 版本取上面解析出的 APPKIT_TOOL。
      # 默认只查生产代码——存量域的测试文件不该被规则升级一夜卡红，
      # 要连测试一起查在本地 make lint 里显式 -xxx.tests=true。
      - name: appkit-lint（moneyfloat / ctxstruct / decjson）
        run: go run github.com/forgeplex/appkit/lint/cmd/appkit-lint@"$APPKIT_TOOL" ./...

      - name: go.mod 整洁检查
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: 清理隔离 PostgreSQL
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${APPKIT_TEST_DB_CONTAINER:-}" ]] && docker container inspect "$APPKIT_TEST_DB_CONTAINER" >/dev/null 2>&1; then
            if [[ "$(docker inspect --format '{{.State.Running}}' "$APPKIT_TEST_DB_CONTAINER")" == true ]]; then
              docker stop --timeout 10 "$APPKIT_TEST_DB_CONTAINER"
            fi
            docker rm "$APPKIT_TEST_DB_CONTAINER"
          fi
          if [[ -n "${APPKIT_TEST_DB_ROOT:-}" ]]; then
            if [[ ! "$APPKIT_TEST_DB_ROOT" =~ ^/tmp/webhook-db-test\.[A-Za-z0-9]{8}$ ]]; then
              echo "::error::隔离 PostgreSQL 临时目录路径不符合预期，保留现场"
              exit 1
            fi
            if [[ -L "$APPKIT_TEST_DB_ROOT" ]]; then
              echo "::error::隔离 PostgreSQL 临时目录变成了符号链接，拒绝删除"
              exit 1
            fi
            if [[ -d "$APPKIT_TEST_DB_ROOT" ]]; then
              if [[ -L "$APPKIT_TEST_DB_ROOT/socket" || ! -d "$APPKIT_TEST_DB_ROOT/socket" ]]; then
                echo "::error::隔离 PostgreSQL socket 目录不存在或不是普通目录"
                exit 1
              fi
              for entry in "$APPKIT_TEST_DB_ROOT"/socket/.[!.]* "$APPKIT_TEST_DB_ROOT"/socket/*; do
                [[ -e "$entry" || -L "$entry" ]] || continue
                if [[ -d "$entry" && ! -L "$entry" ]]; then
                  echo "::error::隔离 PostgreSQL socket 目录包含意外子目录，保留现场"
                  exit 1
                fi
                unlink -- "$entry"
              done
              rmdir -- "$APPKIT_TEST_DB_ROOT/socket" "$APPKIT_TEST_DB_ROOT"
            fi
          fi

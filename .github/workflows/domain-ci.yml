# 域仓库复用的 CI（域仓库的 .github/workflows/ci.yml 由 appkit sync 生成，一行 uses 引用本文件）。
name: domain-ci

on:
  workflow_call:
    inputs:
      go-version:
        description: Go 版本
        type: string
        required: false
        default: "1.26"

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: appkit
          POSTGRES_DB: appkit_test
        ports:
          - 55499:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d appkit_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:appkit@127.0.0.1:55499/appkit_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: gofmt 检查
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未经 gofmt 格式化:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

      - name: appkit check（架构检查）
        run: go run github.com/forgeplex/appkit/cmd/appkit check

      - name: appkit sync 漂移检查
        run: go run github.com/forgeplex/appkit/cmd/appkit sync --check

      # schema 文档漂移：改了迁移却没跑 make schema 就会红。
      # 不加 if: 守卫也不加 continue-on-error——跳不跳由命令自己按启用门决定：
      # db/SCHEMA.md 与 db/schema/ 都不存在的仓库打一条 ::notice 后退出 0，
      # 任一存在就严格检查。本文件经 @main 被全部存量域仓库共享，
      # 硬加一个新检查会让它们在合并那一刻集体变红。
      - name: appkit schema 漂移检查
        run: go run github.com/forgeplex/appkit/cmd/appkit schema -check

      # 先验规则集未漂移，再按规则集跑 lint——否则跑的可能是被改松的配置。
      # 版本必须与 ruleset.GolangciLintVersion / ruleset.ArchLintVersion 一致
      # （域仓库 Makefile 的 lint 目标从那里渲染），否则本地绿、CI 红。
      - name: golangci-lint（depguard / wrapcheck / forbidigo）
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2 run ./...

      - name: go-arch-lint（组件依赖矩阵）
        run: go run github.com/fe3dback/go-arch-lint@v1.18.0 check

      - name: go.mod 整洁检查
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
